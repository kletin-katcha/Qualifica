<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Qualifica+</title>
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>
    <div class="login-container">
        <h1>Login</h1>
        <form class="login-form">
            <div class="input-group">
                <label for="usuario">Usuário, E-mail ou ID</label>
                <input type="text" id="usuario" placeholder="Usuário, E-mail ou ID" required>
            </div>
            <div class="input-group">
                <label for="password">Sua senha</label>
                <input type="password" id="password" placeholder="********" required>
            </div>
            <button type="submit" class="login-button" href="index.html">Logar</button>
        </form>
        <div class="footer">
            <p>Ainda não tem conta? <a href="#">Cadastre-se</a></p>
        </div>
    </div>
    <script src="assets/js/login.js"></script>
</body>
</html>
